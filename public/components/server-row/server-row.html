<div class="root-head" ng-if="!$ctrl.single" ng-click="$ctrl.Tree.ToggleRoot( $ctrl.server )" title="{{ $ctrl.Tree.RootTitle( $ctrl.server ) }}" on-context-menu="$ctrl.Tree.OpenMenu('root', $ctrl.server, null, $event)">
	<span class="chevron" ng-class="{ folded: $ctrl.Tree.IsRootClosed( $ctrl.server ) }"></span>
	<span class="tree-icon icon-server"></span>
	<span class="connection root-dot" ng-class="{ live: $ctrl.server.Live }"></span>
	<span class="root-name">{{ $ctrl.server.Name }}</span>
	<span class="me muted" ng-show="$ctrl.server.Me">you are {{ $ctrl.server.Me.Display }} ({{ $ctrl.server.Me.Role }})</span>
	<span class="root-offline muted" ng-show="!$ctrl.server.Live">offline</span>
	<button class="row-menu" ng-attr-id="{{ $ctrl.first ? 'root-menu' : undefined }}" ng-class="{ shown: $ctrl.Tree.MenuOpenFor( { Id: 'root:' + $ctrl.server.Key } ) }" title="the server's menu: New Project, Import, Settings, Reload" ng-click="$ctrl.Tree.OpenMenu('root', $ctrl.server, null, $event)"><svg class="icon"><use href="#i-more"></use></svg></button>
</div>
<name-form ng-if="$ctrl.CreatingProject()" model="$ctrl.Tree.Creating.Name" placeholder="{{ $ctrl.Tree.CreatePlaceholder() }}" note="{{ $ctrl.CreatingNote() }}" folder="$ctrl.Tree.HasDesktop && $ctrl.Tree.CreatingIsLocal()" submit="$ctrl.Tree.Create()" cancel="$ctrl.Tree.CancelCreate()"></name-form>
<div class="root-body" ng-if="$ctrl.BodyShown()">
	<div class="projects">
		<project-view class="project" ng-repeat="project in $ctrl.Projects() track by project.Id" ng-class="{ open: $ctrl.single || $ctrl.Tree.IsOpen(project), single: $ctrl.single }" data-project="{{ project.Id }}" entry="project" root="$ctrl.server" single="$ctrl.single"></project-view>
	</div>

	<!-- The Desktop's sidecar mode (plan The Server, Step 4): no LLMs and no users; those are a Server's. -->
	<llm-fold ng-if="!$ctrl.server.Sidecar" root="$ctrl.server" first="$ctrl.first"></llm-fold>

	<users-fold ng-if="!$ctrl.server.Sidecar" root="$ctrl.server" first="$ctrl.first"></users-fold>

	<div class="list-heading trash-heading" ng-click="$ctrl.Tree.ToggleTrash( $ctrl.server )" title="the deleted items of this server's projects" on-context-menu="$ctrl.Tree.OpenMenu('trash', $ctrl.server, null, $event)">Trash <span class="tally" title="the items in the trash">{{ $ctrl.Tree.Of( $ctrl.server ).Trash.length }}</span>
		<span class="row-menu" role="button" ng-if="$ctrl.server.Me.Role === 'owner'" ng-class="{ shown: $ctrl.Tree.MenuOpenFor( { Id: 'trash:' + $ctrl.server.Key } ) }" title="actions" ng-click="$ctrl.Tree.OpenMenu('trash', $ctrl.server, null, $event)"><svg class="icon"><use href="#i-more"></use></svg></span>
	</div>
	<div ng-show="$ctrl.Tree.Of( $ctrl.server ).ShowingTrash">
		<div class="confirm trash-confirm" ng-if="$ctrl.Tree.IsEmptyingTrash( $ctrl.server )">
			empty the trash for good?
			<button class="btn btn-sm btn-danger confirm-empty-trash" ng-click="$ctrl.Tree.EmptyTrash( $ctrl.server, $event )"><svg class="icon lead"><use href="#i-check"></use></svg>Yes</button>
			<button class="btn btn-sm btn-outline-secondary" ng-click="$ctrl.Tree.CancelDelete($event)"><svg class="icon lead"><use href="#i-x"></use></svg>No</button>
		</div>
		<div class="list-empty" ng-show="$ctrl.Tree.Of( $ctrl.server ).Trash.length === 0">empty</div>
		<div class="plan-item trashed" ng-repeat="plan in $ctrl.Tree.Of( $ctrl.server ).Trash">
			<div class="plan-title">{{ plan.Title }}</div>
			<div class="muted small">{{ plan.Updated | when }}</div>
		</div>
	</div>
</div>
