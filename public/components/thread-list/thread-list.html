<thread-compose ng-if="$ctrl.State.Compose"></thread-compose>
<div class="threads-empty" ng-show="$ctrl.State.Open && $ctrl.Listed().length === 0 && !$ctrl.State.Compose">no threads {{ $ctrl.State.Filter === 'all' ? '' : 'match this filter' }}</div>
<thread-card ng-repeat="thread in $ctrl.Listed() track by thread.Id" thread="thread"></thread-card>
