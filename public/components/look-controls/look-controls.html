<div class="look-controls">
	<label class="look-row">
		<span>Theme</span>
		<select class="form-select form-select-sm" ng-model="$ctrl.Theme" ng-change="$ctrl.SetTheme()" title="theme" id="theme-select" ng-options="palette.Id as palette.Label for palette in $ctrl.Palettes"></select>
	</label>
	<label class="look-row">
		<span>Size</span>
		<select class="form-select form-select-sm" ng-model="$ctrl.Scale" ng-change="$ctrl.SetScale()" title="size" id="scale-select">
			<option value="small">Small</option>
			<option value="normal">Normal</option>
			<option value="large">Large</option>
		</select>
	</label>
	<label class="look-row" ng-if="$ctrl.ViewWritable()">
		<span>Margins</span>
		<select class="form-select form-select-sm" ng-model="$ctrl.Margins" ng-change="$ctrl.SetMargins()" title="the margins beside the text: Narrow lets it take the pane, Normal holds it to 68rem, Wide to 52rem" id="margins-select">
			<option value="narrow">Narrow</option>
			<option value="normal">Normal</option>
			<option value="wide">Wide</option>
		</select>
	</label>
	<label class="look-row" ng-if="$ctrl.ViewWritable()">
		<span>Editor</span>
		<select class="form-select form-select-sm" ng-model="$ctrl.Editor" ng-change="$ctrl.SetEditor()" title="the editor: CodeMirror, the Live Preview as the one view, or Monaco with Read and Edit" id="editor-select">
			<option value="monaco">Monaco</option>
			<option value="codemirror">CodeMirror</option>
		</select>
	</label>
	<label class="look-row look-check">
		<span>Confirm on close</span>
		<input type="checkbox" class="form-check-input" id="confirm-close" ng-model="$ctrl.ConfirmClose" ng-change="$ctrl.SetConfirmClose()" title="ask before the window closes, or the page is left, with unsaved changes; off, they come back as drafts next time">
	</label>
</div>
